<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="t d">
<title id="t">Lounge 황금빛 아치와 별빛</title><desc id="d">네이비와 금빛으로 장식된 밤의 프라이빗 라운지 입구, 황금 원형 엠블럼과 신비로운 별빛</desc>
<defs>
