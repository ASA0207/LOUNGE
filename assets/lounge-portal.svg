<radialGradient id="sky" cx="50%" cy="31%" r="62%"><stop stop-color="#284a60" stop-opacity=".94"/><stop offset=".52" stop-color="#1a2344" stop-opacity=".61"/><stop offset="1" stop-color="#080d1b" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop stop-color="#f9e2a8" stop-opacity=".57"/><stop offset=".29" stop-color="#c69d57" stop-opacity=".18"/><stop offset="1" stop-color="#c69d57" stop-opacity="0"/></radialGradient>
